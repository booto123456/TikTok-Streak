name: TikTok Streak

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  streak:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run TikTok Streak
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WHITELIST_KEY: ${{ secrets.WHITELIST_KEY }}
          HEADLESS: "true"
          DEBUG: "1"
          # repo นี้เป็น private แล้ว แต่ยังซ่อนชื่อไว้กันพลาด
          HIDE_NAMES: "1"
        run: node index.js

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-screenshot.png
          if-no-files-found: ignore

      - name: Discord Notification
        if: always()
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: TikTok Streak
          content: |
            **TikTok Streak**
            Status: `${{ job.status }}`
            Repository: `${{ github.repository }}`
            Trigger: `${{ github.event_name }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
